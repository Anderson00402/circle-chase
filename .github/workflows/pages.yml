# Publishes the website with every version of the game (see tools/build_site.py):
# main at the root, each branch at /v/<branch>/, each open pull request at /pr/<number>/,
# and a list at /versions/. Only main ever deploys: a push to any other branch just asks
# main to rebuild, which picks that branch up.
name: Website with every version

on:
  push:
  delete:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ask-main:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask main to rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Pull requests run this from main too, so a pull request can't change how the site is built.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Build every version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pr/*'
          python3 tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
