<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Circle Chase</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Major+Mono+Display&display=swap">
<style>
/* Layout: a drafting sheet. The board is the drawing and the score bar above it is its title block. */
:root {
  color-scheme: dark;
  --desk: #0a1b3d;
  --paper: #11306a;
  --panel: #0e2858;
  --grid: rgba(166, 196, 255, 0.09);
  --maze-bg: #000000;
  --maze-wall: #1c6cfc;
  --line: #dbe7ff;
  --ink: #eef3ff;
  --ink-dim: #a3b6de;
  --rule: rgba(219, 231, 255, 0.22);
  --scrim: rgba(9, 24, 54, 0.66);
  --accent: #ff8a4c;
  --on-accent: #1d0d03;
  --hunter: #ff6f91;
  --ambusher: #ff8a3d;
  --guard: #ffd84a;  /* control: the same yellow as the player, as in the default game */
  --drifter: #b9a2ff;
  --scared: #8fd3ff;
  --scared-fill: rgba(143, 211, 255, 0.12);
  --dot: #b9cdf6;
  --player: #ffffff;
  --you: #ffd84a;
  --font-display: "Major Mono Display", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { background: var(--desk); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1160px; margin: 0 auto; padding-block: 16px; }

.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* Title block: as wide as the board */
.stack { display: flex; flex-direction: column; gap: 10px; width: min-content; }
.titleblock { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--rule); background: var(--panel); }
.titleblock > div { padding: 6px 10px 7px; border-left: 1px solid var(--rule); min-width: 0; }
.titleblock > div:first-child { border-left: 0; }
.label { display: block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.value { display: block; font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lives { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 30px; font-family: var(--font-mono); font-size: 13px; }
.lives i { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--you); }
@media (max-width: 520px) {
  .titleblock > div { padding: 5px 6px 6px; }
  .label { letter-spacing: 0.06em; }
  .value { font-size: 15px; }
  .lives { gap: 4px; }
  .lives i { width: 10px; height: 10px; }
}
/* Small phones: two rows, Score / Best / Level over Lives / Time */
@media (max-width: 400px) {
  .titleblock { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .titleblock > div { grid-column: span 2; padding: 5px 8px 6px; }
  .titleblock > div:nth-child(n+4) { grid-column: span 3; border-top: 1px solid var(--rule); }
  .titleblock > div:nth-child(4) { border-left: 0; }
  .value { font-size: 17px; }
  .lives i { width: 12px; height: 12px; }
}

/* Board */
.sheet-wrap { display: flex; justify-content: center; min-width: 0; }
.sheet { position: relative; line-height: 0; }
#board { display: block; touch-action: none; border: 1px solid var(--rule); background: var(--maze-bg); }
.overlay {
  position: absolute; inset: 1px; display: grid; place-items: center; padding: 14px;
  background: var(--scrim); line-height: 1.5; text-align: center;
}
.card { background: var(--panel); border: 1px solid var(--rule); padding: 18px 20px 16px; max-width: 320px; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 5vw, 34px); line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.card p { margin: 0 0 14px; color: var(--ink-dim); }
.card .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.card .hint { margin: 12px 0 0; font-size: 13px; }
.card .note { margin: 8px 0 0; font-size: 12px; text-wrap: balance; }

.btn {
  font-family: var(--font-mono); font-weight: 600; font-size: 14px; letter-spacing: 0.03em;
  padding: 9px 16px; border-radius: 3px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
.btn:hover { background: var(--grid); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="page">
  <main class="board-col" aria-label="Game">
    <div class="sheet-wrap" id="sheet-wrap">
      <div class="stack">
        <div class="titleblock" role="group" aria-label="Score">
          <div><span class="label">Score</span><span class="value" id="hud-score">0</span></div>
          <div><span class="label">Best</span><span class="value" id="hud-best">0</span></div>
          <div><span class="label">Level</span><span class="value" id="hud-level">1</span></div>
          <div><span class="label">Lives</span><span class="lives" id="hud-lives"></span></div>
          <div><span class="label">Time</span><span class="value" id="hud-time">0:00</span></div>
        </div>
        <div class="sheet">
          <canvas id="board" role="img" aria-label="Game board"></canvas>
          <div class="overlay" id="overlay">
            <div class="card">
              <h2 id="ov-title">circle chase</h2>
              <p id="ov-text">Eat every dot. You can only catch the ghosts after a power dot.</p>
              <div class="actions">
                <button class="btn primary" id="ov-primary" type="button">Start game</button>
                <button class="btn" id="ov-secondary" type="button" hidden>New game</button>
              </div>
              <p class="hint" id="ov-hint">Arrow keys or WASD to move. P to pause.</p>
              <p class="note" id="ov-note" hidden>Anonymous play times are saved for a class study.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script id="core">
/* Game rules. No page access here, so the same code runs in a test harness. */
const Core = (() => {
  const DIRS = [{ x: 0, y: -1 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }]; // up, left, down, right
  const UP = 0, LEFT = 1;
  const rev = d => (d < 0 ? -1 : (d + 2) % 4);
  const PATH = 0, WALL = 1, DOOR = 2, PEN = 3;

  const PLAYER_SPEED = 5.7; // tiles per second
  // Ghost speed as a share of the player's: the same on every level and difficulty, slow enough that
  // you can outrun any ghost. Scared ghosts are slower by the same share (they were 55%).
  const GHOST_PACE = 0.6, SCARED_PACE = 0.35;
  const TURN_MEMORY = 0.5;  // seconds an early key press is kept
  const READY_TIME = 1.8, DEATH_TIME = 1.6, CLEAR_TIME = 2.2;
  const EXIT = [9, 7], HOME = [9, 10], BANNER_ROW = 13;
  const PEN_SLOTS = [[9, 9], [9, 10], [9, 11]];
  const GUARD_LINE = 10;    // the Guard chases only at or below this row

  // Left half of each maze (columns 0-9); the right half mirrors it.
  // # wall  . dot  o power dot  - pen door  _ pen  (space) open floor
  // A maze can set its own exit, home, pen slots, guard line and banner row; the rest use the defaults above.
  const MAZES = [
    // Neon: three side tunnels and a wide pen with room for three ghosts side by side.
    { name: 'Neon', start: [9, 15], exit: [9, 7], home: [9, 9], pen: [[8, 9], [9, 9], [10, 9]], guardLine: 9, banner: 11, half: [
      '##########',
      '#o........',
      '#.##.#####',
      '#........#',
      '###.#.##.#',
      '###.#.##..',
      '###.#.###.',
      ' ...#.....',
      '#####.###-',
      ' .....##__',
      '#####.####',
      ' ...#.....',
      '###.#.####',
      '###.#....#',
      '###.#.##.#',
      '#.....##..',
      '#.##.#####',
      '#o........',
      '##########',
    ] },
    { name: 'Rings', start: [9, 15], half: [
      '##########',
      '#o........',
      '#.###.####',
      '#.#.......',
      '#.#.#####.',
      '#.#.#.....',
      '#.#.#.#.##',
      '#.#...#...',
      '#.#.#.#.#-',
      '#.#.#.#.#_',
      ' ...#...#_',
      '#.#.#.#.#_',
      '#.#.#.#.##',
      '#.#...#...',
      '#.#.#.###.',
      '#.#.#.....',
      '#.#.##.###',
      '#.#.......',
      '#.#######.',
      '#o........',
      '##########',
    ] },
    { name: 'Blocks', start: [9, 16], half: [
      '##########',
      '#o........',
      '#.##.#####',
      '#.##.#####',
      '#.........',
      '#.##.##.##',
      '#.##.##.##',
      '#.##......',
      '#.##.##.#-',
      '#.##.##.#_',
      ' ....##.#_',
      '#.##.##.#_',
      '#.##.##.##',
      '#.##......',
      '#.##.##.##',
      '#.##.##.##',
      '#.........',
      '#.##.#####',
      '#.##.#####',
      '#o........',
      '##########',
    ] },
  ];

  const GHOSTS = [
    { id: 'hunter', name: 'Hunter', corner: [17, 1] },
    { id: 'ambusher', name: 'Ambusher', corner: [1, 1] },
    { id: 'guard', name: 'Guard', corner: [1, 19] },
    { id: 'drifter', name: 'Drifter', corner: [17, 19] },
  ];

  // INK-REFILL PROTOTYPE: the default game (the control version's rules below) plus one fix, each scared
  // ghost's own color rising back up inside it as the power runs out (see drawInkRefill and the ghosts in
  // draw()). Ghost speed is GHOST_PACE as in every version. Power time below follows the default game on
  // every difficulty (it has no difficulty setting), so fright (and enemy, enemyStep, enemyMax) is not used
  // here; lives, release and waves still are.
  // Seconds a power dot lasts on each level; from level 19 on it lasts 0 s: the ghosts only turn around.
  const POWER_TIME = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1, 0];

  // enemy, enemyStep, enemyMax: not used any more (every ghost moves at GHOST_PACE on every level).
  // waves: alternating scatter/chase lengths in seconds, starting with scatter
  const DIFFICULTY = {
    easy:   { label: 'Easy',   lives: 5, enemy: 0.6, enemyStep: 0.03, enemyMax: 0.85, fright: 9,   release: [0, 3, 7, 11], waves: [9, 15, 9, 15, 7, Infinity] },
    normal: { label: 'Normal', lives: 3, enemy: 0.7, enemyStep: 0.04, enemyMax: 0.95, fright: 6,   release: [0, 2, 5, 8],  waves: [7, 20, 7, 20, 5, Infinity] },
    hard:   { label: 'Hard',   lives: 3, enemy: 0.8, enemyStep: 0.04, enemyMax: 1,    fright: 3.5, release: [0, 1, 3, 5],  waves: [5, 25, 4, Infinity] },
  };

  function buildMaze(def) {
    const rows = def.half.map(h => h + [...h.slice(0, 9)].reverse().join(''));
    const H = rows.length, W = rows[0].length;
    const tiles = new Uint8Array(W * H), dots = new Uint8Array(W * H);
    let total = 0;
    rows.forEach((row, y) => [...row].forEach((c, x) => {
      const i = y * W + x;
      tiles[i] = c === '#' ? WALL : c === '-' ? DOOR : c === '_' ? PEN : PATH;
      if (c === '.' || c === 'o') { dots[i] = c === 'o' ? 2 : 1; total++; }
    }));
    const s = def.start[1] * W + def.start[0];
    if (dots[s]) { dots[s] = 0; total--; }
    const m = {
      name: def.name, W, H, tiles, dots, total, left: total, start: def.start, tunnelRows: new Set(),
      exit: def.exit || EXIT, home: def.home || HOME, penSlots: def.pen || PEN_SLOTS,
      guardLine: def.guardLine ?? GUARD_LINE, banner: def.banner ?? BANNER_ROW,
    };
    for (let y = 0; y < H; y++) if (tiles[y * W] !== WALL) m.tunnelRows.add(y);
    m.distExit = flood(m, m.exit);
    m.distHome = flood(m, m.home);
    return m;
  }

  // Steps from every open tile to (sx, sy), walking through the pen door.
  function flood(m, [sx, sy]) {
    const dist = new Int16Array(m.W * m.H).fill(-1);
    const queue = [[sx, sy]];
    dist[sy * m.W + sx] = 0;
    for (let q = 0; q < queue.length; q++) {
      const [x, y] = queue[q];
      for (const d of DIRS) {
        const nx = (x + d.x + m.W) % m.W, ny = y + d.y;
        if (ny < 0 || ny >= m.H) continue;
        const i = ny * m.W + nx;
        if (m.tiles[i] === WALL || dist[i] >= 0) continue;
        dist[i] = dist[y * m.W + x] + 1;
        queue.push([nx, ny]);
      }
    }
    return dist;
  }

  function createGame(diffKey = 'normal', emit = () => {}, rng = Math.random) {
    const diff = DIFFICULTY[diffKey] || DIFFICULTY.normal;
    const g = {
      diffKey, diff, level: 1, score: 0, lives: diff.lives, extraGiven: false,
      state: 'ready', stateTime: 0, time: 0, maze: null, player: null, enemies: [],
      want: -1, wantAge: 0, fright: 0, frightTotal: 0, chain: 0,
      hitStop: 0, lifeTime: 0, modeIndex: 0, modeTime: 0, popups: [],
    };
    let m;

    const wrapX = x => ((x % m.W) + m.W) % m.W;
    const tileAt = (x, y) => (y < 0 || y >= m.H ? WALL : m.tiles[y * m.W + wrapX(x)]);
    const mode = () => (g.modeIndex % 2 === 0 ? 'scatter' : 'chase');
    const setState = s => { g.state = s; g.stateTime = 0; };

    function pos(e) {
      if (e.dir < 0) return [e.x, e.y];
      const d = DIRS[e.dir];
      return [e.x + d.x * e.t, e.y + d.y * e.t];
    }

    function loadLevel() {
      m = buildMaze(MAZES[(g.level - 1) % MAZES.length]);
      g.maze = m;
      resetActors();
    }

    function resetActors() {
      g.player = { x: m.start[0], y: m.start[1], dir: LEFT, face: LEFT, t: 0 };
      g.enemies = GHOSTS.map((def, i) => {
        const [x, y] = i === 0 ? m.exit : m.penSlots[i - 1];
        return {
          def, x, y, t: 0, dir: i === 0 ? LEFT : UP, state: i === 0 ? 'active' : 'waiting',
          releaseAt: diff.release[i], scared: false, flip: false, drift: [0, 0], driftAt: -1,
          revertedAt: -1, // game time this ghost stopped being scared because the power ran out (for drawing only)
        };
      });
      Object.assign(g, { want: -1, wantAge: 0, fright: 0, chain: 0, hitStop: 0, lifeTime: 0, modeIndex: 0, modeTime: 0 });
    }

    function addScore(n) {
      g.score += n;
      if (!g.extraGiven && g.score >= 10000) { g.extraGiven = true; g.lives++; emit('extra'); }
    }

    function steer(d) { g.want = d; g.wantAge = 0; }

    function update(dt) {
      g.time += dt;
      g.stateTime += dt;
      for (const p of g.popups) p.age += dt;
      g.popups = g.popups.filter(p => p.age < 1);
      if (g.state === 'ready') { if (g.stateTime >= READY_TIME) setState('playing'); return; }
      if (g.state === 'dying') {
        if (g.stateTime < DEATH_TIME) return;
        if (g.lives <= 0) { setState('over'); emit('over'); } else { resetActors(); setState('ready'); }
        return;
      }
      if (g.state === 'clear') {
        if (g.stateTime >= CLEAR_TIME) { g.level++; loadLevel(); setState('ready'); emit('level'); }
        return;
      }
      if (g.state !== 'playing') return;
      if (g.hitStop > 0) { g.hitStop -= dt; return; }
      step(dt);
    }

    function step(dt) {
      g.lifeTime += dt;
      if (g.want >= 0 && (g.wantAge += dt) > TURN_MEMORY) g.want = -1;
      if (g.fright > 0) {
        g.fright -= dt;
        if (g.fright <= 0) {
          g.fright = 0;
          for (const e of g.enemies) { if (e.scared) e.revertedAt = g.time; e.scared = false; }
        }
      } else if (g.modeIndex < diff.waves.length - 1) {
        g.modeTime += dt;
        if (g.modeTime >= diff.waves[g.modeIndex]) {
          g.modeIndex++;
          g.modeTime = 0;
          for (const e of g.enemies) if (e.state === 'active') e.flip = true;
          emit('mode', mode());
        }
      }
      for (const e of g.enemies) if (e.state === 'waiting' && g.lifeTime >= e.releaseAt) e.state = 'leaving';

      movePlayer(dt);
      if (g.state !== 'playing') return;
      for (const e of g.enemies) moveEnemy(e, dt);
      checkHits();
    }

    // ---- player ----
    const playerCan = (x, y, d) => tileAt(x + DIRS[d].x, y + DIRS[d].y) === PATH;

    function movePlayer(dt) {
      const p = g.player;
      if (g.want >= 0 && p.dir >= 0 && g.want === rev(p.dir) && p.t > 0) {
        const d = DIRS[p.dir];
        p.x = wrapX(p.x + d.x); p.y += d.y; p.t = 1 - p.t;
        p.dir = p.face = g.want; g.want = -1;
      }
      let dist = PLAYER_SPEED * dt;
      for (let n = 0; dist > 1e-9 && n < 8; n++) {
        if (p.t === 0) {
          if (g.want >= 0 && playerCan(p.x, p.y, g.want)) { p.dir = g.want; g.want = -1; }
          else if (p.dir < 0 || !playerCan(p.x, p.y, p.dir)) { p.dir = -1; break; }
          p.face = p.dir;
        }
        const s = Math.min(dist, 1 - p.t);
        p.t += s; dist -= s;
        if (p.t >= 1 - 1e-9) { const d = DIRS[p.dir]; p.x = wrapX(p.x + d.x); p.y += d.y; p.t = 0; }
      }
      // A dot is eaten once the circle is more than halfway onto its tile.
      const [px, py] = pos(p);
      eatAt(wrapX(Math.round(px)), Math.round(py));
    }

    function eatAt(x, y) {
      const i = y * m.W + x, d = m.dots[i];
      if (!d) return;
      m.dots[i] = 0;
      m.left--;
      if (d === 2) { addScore(50); startFright(); emit('power', [x, y]); } else { addScore(10); emit('dot', [x, y]); }
      if (m.left === 0) { setState('clear'); emit('clear'); }
    }

    function startFright() {
      g.fright = g.frightTotal = POWER_TIME[Math.min(g.level, POWER_TIME.length) - 1];
      g.chain = 0;
      // Every ghost turns scared, even those still in the pen (they come out scared); only eaten ones
      // (eyes on their way home) don't. Ghosts out in the maze turn around.
      for (const e of g.enemies) {
        if (e.state === 'returning') continue;
        e.scared = g.fright > 0;
        if (e.state === 'active') e.flip = true;
      }
    }

    // ---- ghosts ----
    // Every ghost moves at GHOST_PACE of your speed, on every level (see PLAYER_SPEED).
    const ghostPace = () => GHOST_PACE;

    function enemySpeed(e) {
      if (e.state === 'returning') return PLAYER_SPEED * 1.9;
      const base = PLAYER_SPEED * ghostPace();
      if (e.state === 'leaving') return base * 0.55;
      if (e.scared) return PLAYER_SPEED * SCARED_PACE;
      if (m.tunnelRows.has(e.y) && (e.x <= 1 || e.x >= m.W - 2)) return base * 0.6;
      return base;
    }

    function enemyCan(e, d) {
      const t = tileAt(e.x + DIRS[d].x, e.y + DIRS[d].y);
      if (t === WALL) return false;
      if (t === DOOR || t === PEN) return e.state === 'leaving' || e.state === 'returning';
      return true;
    }

    function targetOf(e) {
      const p = g.player, d = DIRS[p.face];
      // Corners are set for a 21-row maze; keep them inside shorter ones.
      const corner = [e.def.corner[0], Math.min(e.def.corner[1], m.H - 2)];
      if (mode() === 'scatter') return corner;
      switch (e.def.id) {
        case 'ambusher': return [p.x + d.x * 3, p.y + d.y * 3];
        case 'guard': return p.y >= m.guardLine ? [p.x, p.y] : corner;
        case 'drifter':
          if (g.time >= e.driftAt) {
            e.drift = [Math.round(rng() * 10 - 5), Math.round(rng() * 10 - 5)];
            e.driftAt = g.time + 2;
          }
          return [p.x + e.drift[0], p.y + e.drift[1]];
        default: return [p.x, p.y];
      }
    }

    function chooseDir(e) {
      const open = [];
      for (let d = 0; d < 4; d++) if (enemyCan(e, d)) open.push(d);
      if (!open.length) return -1;
      if (e.state === 'leaving' || e.state === 'returning') {
        const dist = e.state === 'leaving' ? m.distExit : m.distHome;
        let best = open[0], bestD = Infinity;
        for (const d of open) {
          const n = dist[(e.y + DIRS[d].y) * m.W + wrapX(e.x + DIRS[d].x)];
          if (n >= 0 && n < bestD) { bestD = n; best = d; }
        }
        return best;
      }
      let pool = open.filter(d => d !== rev(e.dir));
      if (!pool.length) pool = open;
      if (e.scared) return pool[Math.floor(rng() * pool.length)];
      const [tx, ty] = targetOf(e);
      let best = pool[0], bestD = Infinity;
      for (const d of pool) {
        const dd = (e.x + DIRS[d].x - tx) ** 2 + (e.y + DIRS[d].y - ty) ** 2;
        if (dd < bestD) { bestD = dd; best = d; }
      }
      return best;
    }

    function flip(e) {
      if (e.dir < 0) return;
      if (e.t > 0) { const d = DIRS[e.dir]; e.x = wrapX(e.x + d.x); e.y += d.y; e.t = 1 - e.t; }
      e.dir = rev(e.dir);
    }

    function arrive(e) {
      if (e.state === 'leaving' && e.x === m.exit[0] && e.y === m.exit[1]) e.state = 'active'; // scared or not, as it was
      else if (e.state === 'returning' && e.x === m.home[0] && e.y === m.home[1]) e.state = 'leaving';
    }

    function moveEnemy(e, dt) {
      if (e.state === 'waiting') return;
      if (e.flip) { e.flip = false; flip(e); }
      let dist = enemySpeed(e) * dt;
      for (let n = 0; dist > 1e-9 && n < 8; n++) {
        if (e.t === 0) {
          arrive(e);
          e.dir = chooseDir(e);
          if (e.dir < 0) return;
        }
        const s = Math.min(dist, 1 - e.t);
        e.t += s; dist -= s;
        if (e.t >= 1 - 1e-9) { const d = DIRS[e.dir]; e.x = wrapX(e.x + d.x); e.y += d.y; e.t = 0; }
      }
    }

    function checkHits() {
      const [px, py] = pos(g.player);
      for (const e of g.enemies) {
        if (e.state === 'waiting' || e.state === 'returning') continue;
        const [ex, ey] = pos(e);
        let dx = Math.abs(px - ex);
        dx = Math.min(dx, m.W - dx);
        const dy = py - ey;
        if (dx * dx + dy * dy > 0.36) continue;
        if (e.scared) {
          g.chain = Math.min(g.chain + 1, 4);
          const pts = 100 * 2 ** g.chain;
          addScore(pts);
          e.scared = false;
          e.state = 'returning';
          g.hitStop = 0.35;
          g.popups.push({ x: ex, y: ey, text: '+' + pts, age: 0 });
          emit('eat', pts);
          continue;
        }
        g.lives--;
        setState('dying');
        emit('die');
        return;
      }
    }

    loadLevel();
    return Object.assign(g, { update, steer, pos, mode, targetOf, ghostPace });
  }

  // ---- the power running out ----
  // In the last BLINK_FROM seconds of a power-up the scared ghosts blink between their own color (what
  // they are about to turn back into) and the scared outline: slowly at first, then faster and faster
  // until the power is gone. One blink (own color, then outline) takes BLINK_SLOW seconds as the warning
  // starts and BLINK_FAST at the very end.
  const BLINK_FROM = 3, BLINK_SLOW = 0.5, BLINK_FAST = 0.12;
  // True while the ghosts show their own color, given the seconds of power left.
  function blinkOn(left) {
    if (left <= 0 || left > BLINK_FROM) return false;
    const e = BLINK_FROM - left, f0 = 1 / BLINK_SLOW, f1 = 1 / BLINK_FAST;
    return (f0 * e + ((f1 - f0) * e * e) / (2 * BLINK_FROM)) % 1 < 0.5;
  }

  // ---- play stats ----
  // Numbers for the class study, read from a game while it runs. Times are game seconds, and a paused
  // game does not update, so pauses never count.
  // Chasing, judged each time the circle moves onto a new tile during a power-up: a step that gets
  // closer to the nearest scared ghost but not to any dot only makes sense if you are after the ghost.
  // CHASE_PROOF of those, without a step away from the ghosts in between, start a chase; it lasts while
  // the circle keeps closing in. The last step of a chase, or the last ghost eaten, is when the player
  // stopped chasing. (Steps toward a ghost along a lane of dots prove nothing: eating dots looks the same.)
  const CHASE_PROOF = 2; // 1 counted a plain dot-eater's random turns as chases far too often
  const round2 = n => (n == null ? null : Math.round(n * 100) / 100);

  // Steps from every floor tile to the nearest of the given tiles, along the player's lanes (-1 = none).
  function distFrom(m, sources) {
    const dist = new Int16Array(m.W * m.H).fill(-1), queue = [];
    for (const i of sources) if (m.tiles[i] === PATH && dist[i] < 0) { dist[i] = 0; queue.push(i); }
    for (let q = 0; q < queue.length; q++) {
      const i = queue[q], x = i % m.W, y = (i - x) / m.W;
      for (const d of DIRS) {
        const ny = y + d.y;
        if (ny < 0 || ny >= m.H) continue;
        const j = ny * m.W + (x + d.x + m.W) % m.W;
        if (m.tiles[j] !== PATH || dist[j] >= 0) continue;
        dist[j] = dist[i] + 1;
        queue.push(j);
      }
    }
    return dist;
  }

  // Feed it every game event and call step() after every update; finish() returns the rows to save.
  function createStats(g) {
    const lives = [], ups = [];
    let inPlay = 0, lifeStart = 0, lastDeath = 0, lost = false, open = null, done = false;
    let tile = -1, ateDot = false, proof = 0, chase = false;

    const tileOf = a => {
      const [x, y] = g.pos(a), W = g.maze.W;
      return Math.round(y) * W + ((Math.round(x) % W) + W) % W;
    };

    function chasing() {
      open.chased = true;
      open.stoppedAt = g.time;
      open.stopped_left_s = g.fright;
    }

    function close(ended) {
      if (open) open.ended = ended;
      open = null;
    }

    function event(type) {
      if (done) return;
      if (type === 'power') {
        // The timer from the last stop runs until this power dot.
        const last = ups[ups.length - 1];
        close('new_power');
        if (last && last.stoppedAt != null) last.to_next_power_s = g.time - last.stoppedAt;
        open = {
          n: ups.length + 1, level: g.level, length_s: g.frightTotal, started_s: g.time, chased: false, ghosts_eaten: 0,
          stopped_left_s: null, to_next_power_s: null, ended: null, stoppedAt: null,
        };
        ups.push(open);
        tile = tileOf(g.player);
        ateDot = false;
        proof = 0;
        chase = false;
      } else if (type === 'dot') ateDot = true;
      else if (type === 'eat' && open) {
        open.ghosts_eaten++;
        chasing();
      } else if (type === 'die') {
        lives.push(inPlay - lifeStart);
        lifeStart = inPlay;
        lastDeath = g.time;
        if (g.lives <= 0) lost = true;
        close('died');
      } else if (type === 'clear') close('cleared');
    }

    function step(dt) {
      if (done) return;
      if (g.state === 'playing') inPlay += dt;
      if (!open || g.state !== 'playing') return;
      if (g.fright <= 0) return close('ran_out');
      // Scared ghosts still in the pen keep the power-up going; only those out in the maze can be chased.
      if (!g.enemies.some(e => e.scared)) return close('no_ghosts_left');
      const scared = g.enemies.filter(e => e.scared && e.state === 'active');
      const here = tileOf(g.player);
      if (here === tile) return;
      const from = tile, m = g.maze, ghosts = distFrom(m, scared.map(tileOf)), ate = ateDot;
      tile = here;
      ateDot = false;
      if (!(ghosts[here] >= 0 && ghosts[here] < ghosts[from])) { proof = 0; chase = false; return; }
      const dotTiles = [];
      for (let i = 0; i < m.dots.length; i++) if (m.dots[i]) dotTiles.push(i);
      const dots = distFrom(m, dotTiles);
      const forDots = ate || (dots[here] >= 0 && dots[here] < dots[from]);
      if (!forDots && ++proof >= CHASE_PROOF) chase = true;
      if (chase) chasing();
    }

    // Survival so far, for the clock on screen and the saved game: game seconds from Start, stopped at
    // the death that ends the game (so the death animation and GAME OVER don't add to it).
    const survival = () => (lost ? lastDeath : g.time);

    // ended: 'game_over', or 'quit' when the game is left or restarted first. Null if it never started.
    function finish(ended) {
      if (done || g.time <= 0) return null;
      done = true;
      close('quit');
      return {
        play: {
          difficulty: g.diffKey, ended, survival_s: round2(survival()),
          life_s: lives.map(round2), score: g.score, level: g.level,
        },
        powers: ups.map(({ stoppedAt, ...u }) => ({
          ...u, length_s: round2(u.length_s), started_s: round2(u.started_s),
          stopped_left_s: round2(u.stopped_left_s), to_next_power_s: round2(u.to_next_power_s),
        })),
      };
    }

    return { event, step, finish, survival };
  }

  return { GHOST_PACE, SCARED_PACE, createGame, createStats, blinkOn, BLINK_FROM, buildMaze, MAZES, GHOSTS, DIFFICULTY, POWER_TIME, DIRS, PATH, WALL, DOOR, PEN, EXIT, HOME, BANNER_ROW, PLAYER_SPEED, CHASE_PROOF };
})();
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const STEP = 1 / 120;
  const FONT_MONO = '"Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace';
  const canvas = $('board'), ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const touchUI = matchMedia('(hover: none) and (pointer: coarse)');

  const rootStyle = getComputedStyle(document.documentElement);
  const C = {};
  ['paper', 'maze-bg', 'maze-wall', 'line', 'accent', 'hunter', 'ambusher', 'guard', 'drifter',
    'scared', 'scared-fill', 'dot', 'player', 'you'].forEach(k => { C[k] = rootStyle.getPropertyValue('--' + k).trim(); });

  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ } },
  };

  const settings = { difficulty: 'normal', targets: false, sound: true, ...store.get('circle-chase:settings', {}) };
  if (!Core.DIFFICULTY[settings.difficulty]) settings.difficulty = 'normal';
  const scores = { easy: [], normal: [], hard: [] };
  const savedScores = store.get('circle-chase:scores', {});
  for (const k of Object.keys(scores)) if (Array.isArray(savedScores[k])) scores[k] = savedScores[k].slice(0, 5);

  let game, stats, running = false, paused = false, overlayMode = 'title';
  let T = 0, dpr = 1, layers = {}, lastHud = '', readyLabel = 'READY';
  // Eating animation: dots being swallowed, and when the last one went down (game time).
  let bites = [], lastBite = -1, biteBig = false;
  const GULP = 0.16, SWALLOW = 0.12, BURST = 0.35;

  function bite(tile, big) {
    if (!tile) return;
    lastBite = game.time;
    biteBig = big;
    bites.push({ x: tile[0], y: tile[1], at: game.time, big });
  }

  // ---------- sound ----------
  const sfx = (() => {
    let ac = null, streak = 0, lastDot = 0;
    function ensure() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
      if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    }
    function tone(freq, dur, { type = 'triangle', vol = 0.06, to = 0, delay = 0 } = {}) {
      if (!ac || !settings.sound) return;
      const t0 = ac.currentTime + delay, osc = ac.createOscillator(), gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    }
    const arp = (notes, gap, vol = 0.05) => notes.forEach((f, i) => tone(f, 0.15, { delay: i * gap, vol }));

    return {
      ensure,
      dot() {
        const now = performance.now();
        streak = now - lastDot < 400 ? Math.min(streak + 1, 24) : 0;
        lastDot = now;
        tone(660 * 2 ** (streak / 24), 0.05, { vol: 0.035 });
      },
      power: () => tone(220, 0.35, { type: 'sawtooth', vol: 0.04, to: 880 }),
      eat(pts) {
        const f = 440 * (pts / 200) ** 0.25;
        tone(f, 0.08, { type: 'square', vol: 0.04 });
        tone(f * 1.5, 0.12, { type: 'square', vol: 0.04, delay: 0.08 });
      },
      die: () => tone(520, 0.9, { type: 'sawtooth', vol: 0.05, to: 60 }),
      start: () => arp([523.25, 659.25, 783.99, 1046.5], 0.12),
      clear: () => arp([392, 523.25, 659.25, 783.99, 1046.5], 0.09),
      extra: () => arp([784, 988, 1175, 1568], 0.07),
    };
  })();

  // ---------- play stats ----------
  // Every game is saved for the class study (tools/stats.sql sets up the database): which version,
  // how long the player survived, and when in each power-up they stopped chasing the ghosts. Nothing
  // personal is sent. Only the website and localhost send, and nothing is sent while STATS_URL is empty.
  const STATS_URL = 'https://dxrhqscdztghvhdxcqyu.supabase.co'; // https://<project>.supabase.co
  const STATS_KEY = 'sb_publishable_9UzmSoNoWxQjSXnltHUt_A_Pfiije58'; // the project's publishable key: it can only add games, so it is safe in a public page
  const VERSION = (() => {
    const host = location.hostname, at = location.pathname.match(/\/(v|pr)\/([^/]+)\//);
    if (host.endsWith('github.io')) return at ? (at[1] === 'pr' ? 'pr-' : '') + decodeURIComponent(at[2]) : 'main';
    if (host === 'localhost' || host === '127.0.0.1') return 'localhost';
    return null;
  })();
  // Test browsers (navigator.webdriver) never send, so automated runs stay out of the results.
  const statsOn = Boolean(STATS_URL && STATS_KEY && VERSION && !navigator.webdriver);

  // Every finished game waits in an outbox (this browser's storage) until the database has answered, and
  // each page load sends whatever is still there. A closing page often can't get its request out, and the
  // player may be offline; each game has its own id, so the database keeps one copy however often it arrives.
  const OUTBOX = 'circle-chase:unsent';
  const outbox = () => { const v = store.get(OUTBOX, []); return Array.isArray(v) ? v.filter(d => d && d.play && d.play.id) : []; };

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 15) | 64;
    b[8] = (b[8] & 63) | 128;
    const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }

  function sendStats(data, leaving) {
    const headers = { 'Content-Type': 'application/json', apikey: STATS_KEY };
    if (STATS_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + STATS_KEY; // older keys are tokens and go here too
    // keepalive lets the request outlive the page; only used then, since some browsers refuse it.
    fetch(STATS_URL + '/rest/v1/rpc/record_play', { method: 'POST', headers, body: JSON.stringify(data), keepalive: leaving })
      .then(res => {
        // Saved, or refused for good (4xx): either way it leaves the outbox. A server error is tried again later.
        if (res.status < 500) store.set(OUTBOX, outbox().filter(d => d.play.id !== data.play.id));
      })
      .catch(() => { /* offline or blocked: it stays in the outbox */ });
  }

  function saveStats(ended, leaving = false) {
    const data = stats && stats.finish(ended);
    if (!data || !statsOn) return;
    Object.assign(data.play, { id: uuid(), version: VERSION });
    store.set(OUTBOX, [...outbox(), data].slice(-20));
    sendStats(data, leaving);
  }

  // ---------- game flow ----------
  function onEvent(type, arg) {
    stats.event(type);
    switch (type) {
      case 'dot': sfx.dot(); bite(arg, false); break;
      case 'power': sfx.power(); bite(arg, true); break;
      case 'eat': sfx.eat(arg); break;
      case 'die': sfx.die(); readyLabel = 'READY'; break;
      case 'clear': sfx.clear(); break;
      case 'level': readyLabel = `LEVEL ${game.level}`; fit(); break; // mazes can differ in size
      case 'extra': sfx.extra(); break;
      case 'over': gameOver(); break;
    }
  }

  function newGame() {
    saveStats('quit'); // a game restarted from the pause menu
    game = Core.createGame(settings.difficulty, onEvent);
    stats = Core.createStats(game);
    readyLabel = 'READY';
    bites = [];
    lastBite = -1;
    running = false;
    paused = false;
    lastHud = '';
    fit();
  }

  function begin() {
    sfx.ensure();
    running = true;
    paused = false;
    hideOverlay();
    sfx.start();
  }

  function setPaused(value) {
    if (!running) return;
    paused = value;
    if (paused) showOverlay('paused'); else hideOverlay();
  }

  function primaryAction() {
    if (overlayMode === 'paused') setPaused(false);
    else if (overlayMode === 'over') { newGame(); begin(); }
    else begin();
  }

  function gameOver() {
    running = false;
    saveStats('game_over'); // after this the stats are finished, but survival() still reads the final time
    const g = game;
    let rank = -1;
    if (g.score > 0) {
      const list = scores[g.diffKey];
      const entry = { score: g.score, level: g.level, date: new Date().toISOString().slice(0, 10) };
      list.push(entry);
      list.sort((a, b) => b.score - a.score);
      list.length = Math.min(list.length, 5);
      rank = list.indexOf(entry);
      store.set('circle-chase:scores', scores);
    }
    const label = g.diff.label;
    let text = `You survived ${clock(stats.survival(), true)}, scored ${g.score.toLocaleString('en-US')} on ${label} and reached level ${g.level}.`;
    if (rank === 0) text += ' That is your new best.';
    else if (rank > 0) text += ` That is #${rank + 1} on your ${label} list.`;
    showOverlay('over', text);
  }

  // ---------- overlay ----------
  function showOverlay(mode, text) {
    overlayMode = mode;
    const touch = touchUI.matches;
    const copy = {
      title: ['circle chase', 'Eat every dot. You can only catch the ghosts after a power dot.', 'Start game'],
      paused: ['paused', `The game and the clock are on hold at ${clock(stats.survival())}.`, 'Resume'],
      over: ['game over', text, 'Play again'],
    }[mode];
    $('ov-title').textContent = copy[0];
    $('ov-text').textContent = copy[1];
    $('ov-primary').textContent = copy[2];
    $('ov-secondary').hidden = mode !== 'paused';
    $('ov-hint').textContent = touch ? 'Swipe on the board to move.' : 'Arrow keys or WASD to move. P to pause.';
    $('ov-note').hidden = mode !== 'title' || !statsOn;
    $('overlay').hidden = false;
    if (!touch) $('ov-primary').focus({ preventScroll: true });
  }

  function hideOverlay() {
    overlayMode = null;
    $('overlay').hidden = true;
    if (document.activeElement && document.activeElement.closest('.overlay')) document.activeElement.blur();
  }

  // ---------- sizing ----------
  function fit() {
    const m = game.maze;
    const width = $('sheet-wrap').clientWidth - 2;
    const room = Math.max(300, innerHeight - 110);
    const t = Math.max(12, Math.floor(Math.min(width / m.W, room / m.H)));
    const r = Math.min(window.devicePixelRatio || 1, 3);
    if (t === T && r === dpr && canvas.width === Math.round(T * m.W * dpr) && canvas.height === Math.round(T * m.H * dpr)) return;
    T = t;
    dpr = r;
    layers = {};
    canvas.style.width = T * m.W + 'px';
    canvas.style.height = T * m.H + 'px';
    canvas.width = Math.round(T * m.W * dpr);
    canvas.height = Math.round(T * m.H * dpr);
  }

  // ---------- drawing ----------
  function makeLayer(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    const x = c.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    return [c, x];
  }

  function roundRectPath(c, x, y, w, h, r) {
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  }

  // Walls are neon outlines on black: each wall block gets a rounded blue outline with a soft glow,
  // so the one-tile border reads as a double line and walls that reach the edge end in rounded caps.
  // tint 'clear' turns them orange when a maze is cleared.
  function mazeLayer(tint) {
    const m = game.maze, key = m.name + (tint ? ':' + tint : '');
    if (layers[key]) return layers[key];
    const W = m.W * T, H = m.H * T;
    const isWall = (x, y) => x >= 0 && y >= 0 && x < m.W && y < m.H && m.tiles[y * m.W + x] === Core.WALL;
    const [layer, lx] = makeLayer(W, H);
    lx.fillStyle = C['maze-bg'];
    lx.fillRect(0, 0, W, H);

    const cut = T * 0.17, lw = Math.max(2, T * 0.1);
    const shape = inset => {
      const [c, x] = makeLayer(W, H);
      x.fillStyle = '#fff';
      x.beginPath();
      for (let y = 0; y < m.H; y++) for (let i = 0; i < m.W; i++) if (isWall(i, y)) x.rect(i * T, y * T, T, T);
      x.fill();
      x.globalCompositeOperation = 'destination-out';
      x.beginPath();
      for (let y = -1; y <= m.H; y++) for (let i = -1; i <= m.W; i++) {
        if (!isWall(i, y)) roundRectPath(x, i * T - inset, y * T - inset, T + 2 * inset, T + 2 * inset, inset);
      }
      x.fill();
      return c;
    };
    const outer = shape(cut), inner = shape(cut + lw);

    const ox = outer.getContext('2d');
    ox.setTransform(1, 0, 0, 1, 0, 0);
    ox.globalCompositeOperation = 'destination-out';
    ox.drawImage(inner, 0, 0);
    ox.globalCompositeOperation = 'source-in';
    const wallColor = tint === 'clear' ? C.accent : C['maze-wall'];
    ox.fillStyle = wallColor;
    ox.fillRect(0, 0, outer.width, outer.height);

    lx.setTransform(1, 0, 0, 1, 0, 0);
    lx.shadowColor = wallColor;
    lx.shadowBlur = Math.max(3, T * 0.3) * dpr; // shadow blur ignores the transform, so scale it by hand
    lx.drawImage(outer, 0, 0);
    lx.shadowBlur = 0;
    lx.shadowColor = 'transparent';
    lx.setTransform(dpr, 0, 0, dpr, 0, 0);

    lx.strokeStyle = C.line;
    lx.globalAlpha = 0.6;
    lx.lineWidth = lw;
    lx.setLineDash([T * 0.12, T * 0.1]);
    lx.beginPath();
    for (let y = 0; y < m.H; y++) for (let i = 0; i < m.W; i++) {
      if (m.tiles[y * m.W + i] === Core.DOOR) { lx.moveTo(i * T - cut, (y + 0.5) * T); lx.lineTo((i + 1) * T + cut, (y + 0.5) * T); }
    }
    lx.stroke();
    lx.setLineDash([]);
    lx.globalAlpha = 1;

    layers[key] = layer;
    return layer;
  }

  // Ghosts: a round head that tapers into a wispy tail. The tail streams away from the way the
  // ghost is moving and sways as it floats; the eyes look where it is going.
  function ghostPath(c, cx, cy, t, d, time, phase) {
    const R = t * 0.37, hy = -t * 0.1;
    // The tail curls behind a ghost moving sideways; going up or down, each ghost keeps its own side.
    const side = d.x ? -d.x : (phase % 2 ? 1 : -1);
    const tx = t * 0.22 + Math.sin(time * 5 + phase * 1.7) * t * 0.06, ty = t * 0.47;
    c.save();
    c.translate(cx, cy);
    c.scale(side, 1); // the path keeps this mirroring after restore()
    c.beginPath();
    c.moveTo(-R, hy);
    c.arc(0, hy, R, Math.PI, 0);
    c.bezierCurveTo(R, hy + R, tx + t * 0.12, ty - t * 0.1, tx, ty);
    c.bezierCurveTo(tx - t * 0.1, ty - t * 0.05, -R * 0.9, hy + R * 0.9, -R, hy);
    c.closePath();
    c.restore();
    return cy + hy;
  }

  function ghostEyes(c, cx, hy, t, d, color, glint) {
    for (const side of [-1, 1]) {
      const x = cx + side * t * 0.13 + d.x * t * 0.06, y = hy + d.y * t * 0.05;
      c.fillStyle = color;
      c.beginPath();
      c.ellipse(x, y, t * 0.06, t * 0.09, 0, 0, TAU);
      c.fill();
      if (glint) {
        c.fillStyle = C.player;
        c.beginPath();
        c.arc(x + t * 0.018, y - t * 0.035, t * 0.022, 0, TAU);
        c.fill();
      }
    }
  }

  // o (ink refill only): fill replaces the scared body's faint fill; eyes: 'dark' gives a scared ghost the
  // dark eyes of its normal look.
  function drawGhost(c, cx, cy, t, def, look, dir, time, phase, o = {}) {
    const color = C[def.id];
    const lw = Math.max(1.5, t * 0.07);
    const d = dir >= 0 ? Core.DIRS[dir] : { x: 0, y: 0 };
    const hy = ghostPath(c, cx, cy, t, d, time, phase);
    if (look === 'eyes') {
      // Eaten: a faint dotted outline drifting back to the pen.
      c.globalAlpha = 0.55;
      c.setLineDash([t * 0.07, t * 0.07]);
      c.lineWidth = lw;
      c.strokeStyle = color;
      c.stroke();
      c.setLineDash([]);
      ghostEyes(c, cx, hy, t, d, color, false);
      c.globalAlpha = 1;
      return;
    }
    if (look === 'scared') {
      const ink = C.scared;
      c.fillStyle = o.fill ?? C['scared-fill'];
      c.fill();
      c.setLineDash([t * 0.14, t * 0.09]);
      c.lineWidth = lw;
      c.strokeStyle = ink;
      c.stroke();
      c.setLineDash([]);
      if (o.eyes === 'dark') ghostEyes(c, cx, hy, t, d, C['maze-bg'], true);
      else ghostEyes(c, cx, hy, t, d, ink, false);
      return;
    }
    c.fillStyle = color;
    c.fill();
    ghostEyes(c, cx, hy, t, d, C['maze-bg'], true);
  }

  // ---------- INK-REFILL PROTOTYPE: the one change from the default game ----------
  // Each scared ghost is the empty dashed outline, and its own color rises back up inside it like liquid:
  // empty as the power starts, full as it ends, exactly in proportion to time (it fills by area, so a ghost
  // half full means half the time is gone). In the last INK_WARN seconds the liquid boils (a choppy surface,
  // bubbles rising, drops spattering, a hot surface line) and the part still empty glows pale; the color
  // reaches the top of the head as the power ends, and the ghost, solid and dangerous again, gets a light
  // outline that fades in INK_SEAL seconds. With reduced motion the surface is flat, the bubbles are a few
  // still dots and nothing spatters; the level, the pale cap and the end outline stay.
  const INK_WARN = 2, INK_SEAL = 0.35;
  // Top and bottom of the ghost body, in units of the tile size, from its center.
  const INK_TOP = -0.47, INK_BOTTOM = 0.47;

  const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smoothstep = (e0, e1, x) => { const k = clamp01((x - e0) / (e1 - e0 || 1)); return k * k * (3 - 2 * k); };
  // Random-looking but repeatable numbers from any numbers, so the bubbles need no state between frames.
  function hash(...n) {
    let h = 0x811c9dc5;
    for (const v of n) {
      const a = Math.floor(v * 1000) | 0, b = Math.floor(v) | 0;
      h = Math.imul(h ^ a, 0x01000193);
      h = Math.imul(h ^ b, 0x5bd1e995);
      h ^= h >>> 15;
    }
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const inkColors = new Map();
  let inkProbe = null;
  function rgbaOf(color) {
    let out = inkColors.get(color);
    if (out) return out;
    out = [255, 255, 255, 1];
    const hex = /^#([0-9a-f]{3,8})$/i.exec(color.trim());
    if (hex) {
      let h = hex[1];
      if (h.length <= 4) h = [...h].map(ch => ch + ch).join('');
      const n = parseInt(h.slice(0, 6), 16);
      out = [(n >> 16) & 255, (n >> 8) & 255, n & 255, h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1];
    } else {
      if (!inkProbe) inkProbe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
      inkProbe.clearRect(0, 0, 1, 1);
      inkProbe.fillStyle = color;
      inkProbe.fillRect(0, 0, 1, 1);
      const d = inkProbe.getImageData(0, 0, 1, 1).data;
      out = [d[0], d[1], d[2], d[3] / 255];
    }
    inkColors.set(color, out);
    return out;
  }
  const rgba = (color, a) => { const [r, g, b, al] = rgbaOf(color); return `rgba(${r},${g},${b},${+(al * clamp01(a)).toFixed(3)})`; };
  function mix(a, b, k) {
    const A = rgbaOf(a), B = rgbaOf(b), m = i => Math.round(lerp(A[i], B[i], clamp01(k)));
    return `rgba(${m(0)},${m(1)},${m(2)},${+lerp(A[3], B[3], clamp01(k)).toFixed(3)})`;
  }

  // Height of the liquid surface (from the ghost center, in tile units) that leaves `fill` of the body's area
  // below it. The body is round at the top and tapers to a tail, so filling by height would look nearly full
  // well before the end. Worked out once from the body's outline (the curves of ghostPath, tail at rest).
  const inkLevel = (() => {
    let rows = null;
    const N = 240;
    const build = () => {
      const c = document.createElement('canvas');
      c.width = c.height = N;
      const x = c.getContext('2d', { willReadFrequently: true });
      const t = N * 0.95, R = 0.37 * t, hy = -0.1 * t, tx = 0.22 * t, ty = 0.47 * t;
      x.translate(N / 2, N / 2);
      x.beginPath();
      x.moveTo(-R, hy);
      x.arc(0, hy, R, Math.PI, 0);
      x.bezierCurveTo(R, hy + R, tx + t * 0.12, ty - t * 0.1, tx, ty);
      x.bezierCurveTo(tx - t * 0.1, ty - t * 0.05, -R * 0.9, hy + R * 0.9, -R, hy);
      x.closePath();
      x.fillStyle = '#fff';
      x.fill();
      const d = x.getImageData(0, 0, N, N).data;
      // Area below each row, from the bottom up, as a share of the whole body.
      const area = new Array(N + 1).fill(0);
      for (let y = N - 1; y >= 0; y--) {
        let n = 0;
        for (let i = 0; i < N; i++) n += d[(y * N + i) * 4 + 3] / 255;
        area[y] = area[y + 1] + n;
      }
      const total = area[0] || 1;
      rows = area.map(a => a / total);
    };
    return fill => {
      if (fill <= 0) return INK_BOTTOM;
      if (fill >= 1) return INK_TOP;
      if (!rows) build();
      const t = N * 0.95;
      // First row (from the bottom) whose area below reaches `fill`.
      let y = N - 1;
      while (y > 0 && rows[y] < fill) y--;
      const span = rows[y] - rows[y + 1] || 1, u = (fill - rows[y + 1]) / span;
      return Math.max(INK_TOP, Math.min(INK_BOTTOM, (y + 1 - u - N / 2) / t));
    };
  })();

  // Draws one scared ghost with its own color risen to `fill` (0 empty at the start of the power, 1 full at
  // the end). left: seconds of power left. Same arguments as drawGhost otherwise.
  function drawInkRefill(c, cx, cy, t, def, dir, time, i, fill, left, now, still) {
    const color = C[def.id];
    const d = dir >= 0 ? Core.DIRS[dir] : { x: 0, y: 0 };
    const warn = smoothstep(INK_WARN, INK_WARN - 0.12, left); // the final warning: 0 above 2 s left, 1 from just under
    const deep = clamp01(1 - left / INK_WARN); // how far into it: 0 at 2 s left, 1 at the end
    const body = () => ghostPath(c, cx, cy, t, d, time, i);
    const clip = (path, fn) => { c.save(); path(); c.clip(); fn(); c.restore(); };
    // Only the dashed outline and dark eyes of the scared look, over what is already there.
    const outline = () => drawGhost(c, cx, cy, t, def, 'scared', dir, time, i, { fill: 'rgba(0,0,0,0)', eyes: 'dark' });

    // Surface: a lazy slosh while calm, choppy and boiling in the final warning.
    const sy = cy + t * inkLevel(fill);
    // The waves never cover more than a third of what is still uncolored, so the cap at the top stays
    // clearly visible until the very end: "almost", not "done".
    const cap = sy - (cy + t * INK_TOP);
    const amp = still ? 0 : Math.min(t * (0.022 + warn * (0.035 + 0.03 * deep)), cap * 0.3);
    const kx = TAU / (t * (0.95 - 0.3 * warn));
    const w = 2.2 + warn * 9;
    const y = x => sy
      + amp * Math.sin((x - cx) * kx + now * w + i * 2.1)
      + amp * 0.5 * Math.sin((x - cx) * kx * 1.9 - now * w * 1.4 + i);
    const surface = () => {
      const x0 = cx - t * 0.6, x1 = cx + t * 0.6, N = 14;
      c.moveTo(x0, y(x0));
      for (let n = 1; n <= N; n++) { const x = x0 + ((x1 - x0) * n) / N; c.lineTo(x, y(x)); }
    };

    // 1. The empty scared ghost, exactly as the default game draws it.
    drawGhost(c, cx, cy, t, def, 'scared', dir, time, i);
    if (fill <= 0) return;

    // 2. Below the surface: the body filled solid in its own color, the dashed outline drawn again over it,
    // and dark eyes once the color reaches them.
    c.save();
    c.beginPath();
    surface();
    c.lineTo(cx + t * 0.6, cy + t);
    c.lineTo(cx - t * 0.6, cy + t);
    c.closePath();
    c.clip();
    body();
    c.fillStyle = color;
    c.fill();
    outline();

    // Boiling: bubbles rise from the tail to the surface (still dots with reduced motion).
    if (warn > 0 && t >= 9) {
      clip(body, () => {
        c.fillStyle = rgba('#ffffff', 0.8 * warn);
        const r = Math.max(0.8, t * 0.05);
        if (still) {
          for (let n = 0; n < 4; n++) {
            const bx = cx + (hash(n, 7) - 0.5) * t * 0.42;
            const by = lerp(cy + t * 0.38, sy, 0.2 + 0.6 * hash(n, 8));
            c.beginPath();
            c.arc(bx, by, r * (0.8 + 0.5 * hash(n, 9)), 0, TAU);
            c.fill();
          }
          return;
        }
        const RATE = 10 + 14 * deep, LIFE = 0.42;
        for (let n = Math.floor((now - LIFE) * RATE); n <= Math.floor(now * RATE); n++) {
          const age = now - n / RATE;
          if (age < 0 || age > LIFE) continue;
          const u = age / LIFE;
          const bx = cx + (hash(n, i, 1) - 0.5) * t * 0.42 + Math.sin(age * 20 + n) * t * 0.02;
          const by = lerp(cy + t * 0.4, sy, clamp01(u) ** 2);
          c.beginPath();
          c.arc(bx, by, r * (0.6 + 0.6 * hash(n, i, 2)) * (0.6 + 0.6 * u), 0, TAU);
          c.fill();
        }
      });
    }
    c.restore();

    // Final warning: the part still uncolored lights up pale, so even a thin cap at the top reads as
    // "not yet" until the liquid closes over it at the very end.
    if (warn > 0) {
      clip(body, () => {
        c.beginPath();
        surface();
        c.lineTo(cx + t * 0.6, cy - t);
        c.lineTo(cx - t * 0.6, cy - t);
        c.closePath();
        c.fillStyle = rgba(mix(C.scared, '#ffffff', 0.4), 0.85 * warn);
        c.fill();
      });
      // The outline and eyes stay on top of the pale cap.
      outline();
    }

    // 3. The surface line, light and clear against both the dark body and the color; hotter and thicker
    // once it boils.
    clip(body, () => {
      c.beginPath();
      surface();
      c.lineJoin = 'round';
      c.lineCap = 'round';
      c.strokeStyle = rgba(C['maze-bg'], 0.55);
      c.lineWidth = Math.max(1.2, t * 0.07) * (1 + 0.5 * warn) + 2;
      c.stroke();
      c.strokeStyle = mix(C.scared, '#ffffff', 0.5 + 0.5 * warn);
      c.lineWidth = Math.max(1.2, t * 0.07) * (1 + 0.5 * warn);
      if (warn > 0) {
        c.shadowColor = color;
        c.shadowBlur = t * 0.35 * warn * dpr;
      }
      c.stroke();
    });

    // Spatter: drops jumping off the boiling surface, inside the ghost's outline.
    if (warn > 0 && !still && t >= 9) {
      clip(body, () => {
        c.fillStyle = color;
        const RATE = 12, LIFE = 0.3;
        for (let n = Math.floor((now - LIFE) * RATE); n <= Math.floor(now * RATE); n++) {
          const age = now - n / RATE;
          if (age < 0 || age > LIFE) continue;
          const u = age / LIFE;
          const dx = (hash(n, i, 3) - 0.5) * t * 0.5;
          const h = Math.min(t * (0.08 + 0.1 * deep), cap * 0.4) * (0.6 + 0.4 * hash(n, i, 4));
          c.beginPath();
          c.arc(cx + dx, y(cx + dx) - 4 * h * u * (1 - u), Math.max(0.7, t * 0.04), 0, TAU);
          c.fill();
        }
      });
    }
  }

  // Solid again: a light outline that fades from a ghost the moment the power runs out, age seconds ago.
  function drawInkSeal(c, cx, cy, t, dir, time, i, age) {
    const u = age / INK_SEAL;
    ghostPath(c, cx, cy, t, dir >= 0 ? Core.DIRS[dir] : { x: 0, y: 0 }, time, i);
    c.save();
    c.lineJoin = 'round';
    c.strokeStyle = rgba('#ffffff', 0.9 * (1 - u));
    c.lineWidth = Math.max(1.2, t * (0.1 - 0.06 * u));
    c.stroke();
    c.restore();
  }

  function drawPowerDot(c, cx, cy, t, pulse) {
    const r = t * 0.27 * pulse;
    c.strokeStyle = C.player;
    c.fillStyle = C.player;
    c.lineWidth = Math.max(1.5, t * 0.07);
    c.beginPath();
    c.arc(cx, cy, r, 0, TAU);
    c.stroke();
    c.beginPath();
    c.moveTo(cx - t * 0.42, cy); c.lineTo(cx - r * 0.45, cy);
    c.moveTo(cx + r * 0.45, cy); c.lineTo(cx + t * 0.42, cy);
    c.moveTo(cx, cy - t * 0.42); c.lineTo(cx, cy - r * 0.45);
    c.moveTo(cx, cy + r * 0.45); c.lineTo(cx, cy + t * 0.42);
    c.lineWidth = Math.max(1, t * 0.04);
    c.stroke();
    c.beginPath();
    c.arc(cx, cy, t * 0.09, 0, TAU);
    c.fill();
  }

  function eachWrap(x, fn) {
    const W = game.maze.W;
    for (const off of [-W, 0, W]) { const px = x + off; if (px > -1 && px < W) fn((px + 0.5) * T); }
  }

  function draw() {
    const g = game, m = g.maze, reduce = reduceMotion.matches, now = g.time;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const flash = g.state === 'clear' && !reduce && Math.floor(g.stateTime * 4) % 2 === 1;
    ctx.drawImage(mazeLayer(flash ? 'clear' : null), 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // dots
    ctx.fillStyle = C.dot;
    ctx.beginPath();
    const r = Math.max(1.4, T * 0.09);
    for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
      if (m.dots[y * m.W + x] !== 1) continue;
      const cx = (x + 0.5) * T, cy = (y + 0.5) * T;
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, TAU);
    }
    ctx.fill();
    const pulse = reduce ? 1 : 1 + 0.12 * Math.sin(performance.now() / 160);
    for (let y = 0; y < m.H; y++) for (let x = 0; x < m.W; x++) {
      if (m.dots[y * m.W + x] === 2) drawPowerDot(ctx, (x + 0.5) * T, (y + 0.5) * T, T, pulse);
    }

    const showGhosts = g.state !== 'clear' && !(g.state === 'dying' && g.stateTime > 0.35);

    // target lines
    if (settings.targets && showGhosts && g.state !== 'over') {
      ctx.lineWidth = 1.5;
      for (const e of g.enemies) {
        if (e.state !== 'active' || e.scared) continue;
        let [tx, ty] = g.targetOf(e);
        tx = Math.max(0, Math.min(m.W - 1, tx));
        ty = Math.max(0, Math.min(m.H - 1, ty));
        const [ex, ey] = g.pos(e);
        const ax = (ex + 0.5) * T, ay = (ey + 0.5) * T, bx = (tx + 0.5) * T, by = (ty + 0.5) * T, k = T * 0.22;
        ctx.strokeStyle = C[e.def.id];
        ctx.globalAlpha = 0.75;
        ctx.setLineDash([4, 5]);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(bx - k, by - k); ctx.lineTo(bx + k, by + k);
        ctx.moveTo(bx + k, by - k); ctx.lineTo(bx - k, by + k);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // ghosts
    if (showGhosts) {
      g.enemies.forEach((e, i) => {
        let [x, y] = g.pos(e);
        if (e.state === 'waiting' && !reduce) y += Math.sin(now * 4 + i * 2) * 0.16;
        // INK-REFILL PROTOTYPE: the one change from the default game. As the power runs out each scared ghost's
        // own color rises back up inside it (drawInkRefill), instead of the ghosts flashing white; when the
        // power runs out, a light outline fades from each ghost that was scared (drawInkSeal).
        const look = e.state === 'returning' ? 'eyes' : e.scared ? 'scared' : 'normal';
        const time = reduce ? 0 : now, cy = (y + 0.5) * T;
        if (look === 'scared' && g.fright > 0) {
          const fill = g.frightTotal > 0 ? 1 - Math.min(1, g.fright / g.frightTotal) : 1;
          eachWrap(x, cx => drawInkRefill(ctx, cx, cy, T, e.def, e.dir, time, i, fill, g.fright, now, reduce));
          return;
        }
        eachWrap(x, cx => drawGhost(ctx, cx, cy, T, e.def, look, e.dir, time, i));
        const age = look === 'normal' && e.revertedAt >= 0 ? now - e.revertedAt : Infinity;
        if (age >= 0 && age < INK_SEAL) eachWrap(x, cx => drawInkSeal(ctx, cx, cy, T, e.dir, time, i, age));
      });
    }

    // player
    const p = g.player;
    const [px, py] = g.pos(p);
    let pr = T * 0.4;

    // Swallowed dots slide into the circle. They are drawn first so the circle covers them.
    bites = bites.filter(b => now - b.at < SWALLOW && now >= b.at);
    if (!reduce && g.state === 'playing') {
      for (const b of bites) {
        const k = (now - b.at) / SWALLOW;
        let bx = b.x;
        if (bx - px > m.W / 2) bx -= m.W; else if (px - bx > m.W / 2) bx += m.W;
        const x = (bx + (px - bx) * k + 0.5) * T, y = (b.y + (py - b.y) * k + 0.5) * T;
        ctx.fillStyle = b.big ? C.player : C.dot;
        ctx.beginPath();
        ctx.arc(x, y, (b.big ? T * 0.2 : Math.max(1.4, T * 0.09)) * (1 - 0.5 * k), 0, TAU);
        ctx.fill();
      }
    }

    // Gulp: the circle reaches toward each dot it eats, then settles back.
    const since = now - lastBite;
    let s = 0;
    if (!reduce && lastBite >= 0 && since >= 0 && since < GULP && g.state === 'playing') {
      const amp = biteBig ? 0.24 : 0.14;
      s = since < 0.1 ? amp * Math.sin((Math.PI * since) / 0.1) : -0.45 * amp * Math.sin((Math.PI * (since - 0.1)) / (GULP - 0.1));
    }

    // The mouth snaps open and shut during the gulp animation (true = open)
    let blink = false;

    if (!reduce && lastBite >= 0 && since >= 0 && since < GULP && g.state === 'playing') {
      blink = Math.floor(since / 0.06) % 2 === 0;
    }
    if (g.state === 'dying') {
      const k = Math.min(1, g.stateTime / 1.1);
      pr *= 1 - k;
      if (!reduce) {
        eachWrap(px, cx => {
          ctx.strokeStyle = C.you;
          ctx.globalAlpha = 1 - k;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, (py + 0.5) * T, T * (0.4 + k * 1.2), 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        });
      }
    }
    if (g.state !== 'over' && pr > 0.5) {
      const face = Core.DIRS[p.face];
      eachWrap(px, cx => {
        const cy = (py + 0.5) * T;
        ctx.save();
        ctx.translate(cx + face.x * s * pr * 0.5, cy + face.y * s * pr * 0.5);
        ctx.rotate(Math.atan2(face.y, face.x));
        ctx.scale(1 + s, 1 - s * 0.6);
        ctx.fillStyle = C.you;
        ctx.beginPath();
        if (blink) {
          // Mouth open: cut a triangular wedge out of the front of the circle.
          // After rotate(), angle 0 points the way the circle is facing.
          const mouth = Math.PI / 5; // half the mouth opening (36°)
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, pr, mouth, TAU - mouth);
          ctx.closePath();
        } else {
          // Mouth closed: full circle
          ctx.arc(0, 0, pr, 0, TAU);
        }
        ctx.fill();
        ctx.restore();
        // a power dot sends a ring out from the circle
        if (!reduce && biteBig && since >= 0 && since < BURST && g.state === 'playing') {
          const k = since / BURST;
          ctx.strokeStyle = C.you;
          ctx.globalAlpha = 1 - k;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cx, cy, pr * (1 + k), 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      });
    }

    // Control version: no power timer. As in the default game, the only sign the power is running out
    // is the ghosts' flashing.

    // floating points
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${Math.round(T * 0.5)}px ${FONT_MONO}`;
    ctx.lineWidth = 3;
    for (const pop of g.popups) {
      const x = (pop.x + 0.5) * T, y = (pop.y + 0.5 - pop.age * 0.8) * T;
      ctx.globalAlpha = 1 - pop.age;
      ctx.strokeStyle = C['maze-bg'];
      ctx.strokeText(pop.text, x, y);
      ctx.fillStyle = C.player;
      ctx.fillText(pop.text, x, y);
    }
    ctx.globalAlpha = 1;

    // banner
    let text = null;
    if (g.state === 'ready' && running) text = readyLabel;
    if (g.state === 'clear') text = 'MAZE CLEAR';
    if (text) {
      const fs = Math.round(T * 0.62);
      ctx.font = `600 ${fs}px ${FONT_MONO}`;
      const w = ctx.measureText(text).width + fs * 1.2, h = fs * 1.7;
      const cx = (m.W * T) / 2, cy = (m.banner + 0.5) * T;
      ctx.fillStyle = C['maze-bg'];
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1;
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      ctx.strokeRect(cx - w / 2 + 0.5, cy - h / 2 + 0.5, w - 1, h - 1);
      ctx.fillStyle = C.player;
      ctx.fillText(text, cx, cy + 1);
    }
  }

  // ---------- HUD ----------
  // Survival time as m:ss, or m:ss.s with tenths.
  function clock(s, tenths = false) {
    const d = Math.floor(s * 10 + 1e-6), sec = Math.floor(d / 10);
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` + (tenths ? '.' + (d % 10) : '');
  }

  function updateHud() {
    const g = game;
    const best = Math.max(g.score, scores[g.diffKey][0]?.score || 0);
    const time = clock(stats.survival());
    const key = [g.score, best, g.level, g.lives, time].join('|');
    if (key === lastHud) return;
    lastHud = key;
    $('hud-time').textContent = time;
    $('hud-score').textContent = g.score.toLocaleString('en-US');
    $('hud-best').textContent = best.toLocaleString('en-US');
    $('hud-level').textContent = String(g.level);
    const lives = $('hud-lives');
    lives.replaceChildren();
    const shown = Math.min(g.lives, 5);
    for (let i = 0; i < shown; i++) lives.appendChild(document.createElement('i'));
    if (g.lives > shown) lives.append(`+${g.lives - shown}`);
    lives.setAttribute('aria-label', `${g.lives} lives`);
  }

  // ---------- settings ----------
  function saveSettings() { store.set('circle-chase:settings', settings); }

  function toggleSetting(name) {
    settings[name] = !settings[name];
    saveSettings();
    if (name === 'sound' && settings.sound) sfx.ensure();
  }

  // ---------- input ----------
  const KEYS = { ArrowUp: 0, KeyW: 0, ArrowLeft: 1, KeyA: 1, ArrowDown: 2, KeyS: 2, ArrowRight: 3, KeyD: 3 };

  function bindInput() {
    addEventListener('keydown', ev => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const tag = ev.target.tagName;
      if (ev.code in KEYS) {
        if (tag === 'INPUT' && !running) return;
        ev.preventDefault();
        if (running && !paused) game.steer(KEYS[ev.code]);
        return;
      }
      switch (ev.code) {
        case 'KeyP':
        case 'Escape':
          if (running) setPaused(!paused);
          break;
        case 'Space':
          if (tag === 'BUTTON' || tag === 'INPUT') return;
          ev.preventDefault();
          if (running) setPaused(!paused); else primaryAction();
          break;
        case 'Enter':
          if (tag === 'BUTTON' || tag === 'INPUT') return;
          if (overlayMode) { ev.preventDefault(); primaryAction(); }
          break;
        case 'KeyM': toggleSetting('sound'); break;
        case 'KeyT': toggleSetting('targets'); break;
      }
    });

    let swipe = null;
    canvas.addEventListener('pointerdown', ev => { swipe = { x: ev.clientX, y: ev.clientY, id: ev.pointerId }; });
    canvas.addEventListener('pointermove', ev => {
      if (!swipe || ev.pointerId !== swipe.id) return;
      const dx = ev.clientX - swipe.x, dy = ev.clientY - swipe.y;
      if (Math.hypot(dx, dy) < 18) return;
      const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0);
      if (running && !paused) game.steer(d);
      swipe.x = ev.clientX;
      swipe.y = ev.clientY;
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { swipe = null; }));

    $('ov-primary').addEventListener('click', primaryAction);
    $('ov-secondary').addEventListener('click', () => { newGame(); begin(); });

    document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) setPaused(true); });
    addEventListener('pagehide', () => saveStats('quit', true)); // closing the tab or switching versions
    addEventListener('blur', () => { if (running && !paused) setPaused(true); });
    addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('sheet-wrap'));
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    if (running && !paused) {
      acc += dt;
      while (acc >= STEP) { game.update(STEP); stats.step(STEP); acc -= STEP; }
    } else acc = 0;
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }

  function start(data) {
    if (data && data.settings) Object.assign(settings, data.settings);
    bindInput();
    newGame();
    showOverlay('title');
    if (statsOn) for (const data of outbox()) sendStats(data, false); // games an earlier page left behind
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layers = {}; });
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot?.(() => ({ settings: { ...settings } }));
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
